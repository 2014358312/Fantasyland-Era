 #====================== 一、魔法单兵武器线 ======================#
 FE_infantry_weapons_1: "附魔冷兵器"
 FE_infantry_weapons_1_desc: "通过在锻造装备时于附魔金属上镌刻魔导阵纹，可以使其具有更高的破坏力或坚韧度；此外，还可以快速释放使用者并未掌握的法术以对敌。"
 FE_infantry_propulsion_array: "推进法阵"
 FE_infantry_propulsion_array_desc: "在每一个法阵上都添加锁敌符文或飞行符文意味着极大的冗余，通过一个通用的推进法阵将法球提升到一个足够高的速度射向对手能够极大程度地优化魔能利用效率，并且在对低速目标时具有奇效。"
 FE_infantry_weapons_2: "制式法杖"
 FE_infantry_weapons_2_desc: "我觉得我们需要设计一款制式法杖，首先需要易于握持（添加手柄），然后得便于指向前方（主杖体弯折），此外需要足够长的空间来为法球加速（拉长杖身），最后需要一个简化工具避免使用者多次施法的疲劳（魔晶按钮）……嘶这玩意怎么跟火枪那么像？"
 FE_infantry_high_speed_propulsion: "高速推进法阵"
 FE_infantry_high_speed_propulsion_desc: "经由提高推进法阵的效率，我们得以在同样的枪管内提高法球和弹丸的破坏力，也能够缩短枪管以便于近战，这毫无疑问为前线使用者提供了更多的战术方法。"
 FE_infantry_rapid_excitation: "极速激发"
 FE_infantry_rapid_excitation_desc: "由于辅助飞行阵纹的发明，我们的推进法阵得以以较小的功率和较高的频率短时间内多次击发，这使得其使用者能在几秒钟内就投射出数百发弹丸，只要他们的确有这么多魔力水晶并且愿意一次就打出去……"
 FE_infantry_shaped_orb: "塑形法球"
 FE_infantry_shaped_orb_desc: "随着战场上高防护目标越来越多，魔导装具的破甲能力——不管是突破金属装甲还是法术护盾都越来越重要。在装备上增添一种用于调整法球形状以提升尖端突破能力的法阵能一定程度上改善普通士兵面对高防护目标的处境。"
 FE_infantry_weapons_3: "单兵炮台"
 FE_infantry_weapons_3_desc: "将极速激发技术与约束笼技术结合，我们得以成功制造一种兼具高火威力和高射速的中程单兵装具，能对其他未换用此装备的敌人造成极高的打击。"
 ## 注：以下为保留的四级步枪装备（暂无解锁科技，仅存档）
 FE_infantry_weapons_4: "四级步枪"
 FE_infantry_self_propelled_launcher: "自推进弹丸投射器"
 FE_infantry_self_propelled_launcher_desc: "意识到一次性的思路与先前的弹丸技术有一定的相似性，研究人员改制了一批真正具有自推进效果的实体/半实体弹丸，可以在对发射者无负担的情况下进行投射。这种弹丸在后方的推进法阵完成使命后会激活中空部位的融毁符文，采用金属射流和爆炸性法球击穿防护，此外，如果此时仍未命中目标，这种符文也可用于二次推进，但是在该段射程内的杀伤威力则较前段较低……"

 #====================== 二、支援线 ======================#
 FE_support_powered_weapons: "动力武器"
 FE_support_powered_weapons_desc: "借助元素能源辅助驱动的大型冷兵器，笨重、难使用的同时势大力沉，攻无不克。在攻击那些采用低威力杀伤魔法难以快速击毙的目标时具有奇效。只是由于攻击范围较近，使用者往往伤亡率较高。"
 FE_support_enhanced_demolition: "强化弹丸"
 FE_support_enhanced_demolition_desc: "这种装备的最初灵感来源于某某几个在战壕里喝多了把推进器和炼金炸药装到冷兵器前后的酒蒙子……不管怎么说，这极大提升了大锤挥舞起来的速度和力度，还能把那些贸然用法术护盾硬接攻击的敌人炸个底朝天……虽然我们从来没搞懂为什么使用者自己受到的损失这么低，所以也只能解释为勇气与战争之神在保佑他们。"
 FE_support_hand_cannon: "魔导手炮"
 FE_support_hand_cannon_desc: "在进一步地优化这些推进法阵的极限速度和击发频率无果后，技术部门逐渐放弃了向这方面提升的想法，转而开始研发具备有更大威力的微型法球，经过他们的开发，一款威力巨大但射程相对较短的魔导装备应运而生。"
 FE_support_alchemy_bullet: "炼金弹丸"
 FE_support_alchemy_bullet_desc: "采用了静谧法阵推进和阴影元素包覆的弹丸可以部分借助阴影界的力量进入隐蔽状态，在敌人难以察觉的情况下发起攻击，袭击重要目标或制造混乱。唯一的缺点大概是推进法阵的静谧和高速不可兼得。当然，通过增大装具的尺寸，安装额外的减震和回流模块可以制造出一个安放在合适位点的“点名”神器。"
 FE_support_constraint_cage: "约束笼"
 FE_support_constraint_cage_desc: "一个加装于法杖前端的约束器可以确保未完成加速的法球的稳定性，也可以使那些无定形的高能态法术在出膛前保持无害状态。这意味着我们可以制造一款一百米距离内喷吐范围法术的强大魔法装具，这在城市或堡垒内的战斗中具有奇效，可以视作魔导手炮的强化版。"
 FE_support_one_shot_ap_cannon: "一次性穿甲手炮"
 FE_support_one_shot_ap_cannon_desc: "由于带有破甲能力的法球强度往往超出了一般魔导装具的输出上限，技术人员灵光一闪制造出了一批采用廉价材料制成的一次性装具，可以报废为代价发射出一枚能穿透大多数防护的法球。唯一的缺陷是这批装具的准头颇有问题……"
 FE_support_armor_breaking_shell: "破防爆弹"
 FE_support_armor_breaking_shell_desc: "延续之前的思路，他们制作了一种具有极高杀伤力的爆弹，可以在命中目标后以蛮力直接粉碎敌人。但是后来发现这种爆弹不仅杀伤威力大且对普通目标的杀伤效果更好，他们被安装到了额外的发射管上用于远距离多目标杀伤。"


 #====================== 三、魔药线 ======================#
 FE_potion_practical_pharmaceutics: "实用药剂学"
 FE_potion_practical_pharmaceutics_desc: "经过对炼金术和魔药原料生产的改良，我们已经得以大批量低成本地制造魔药了，这允许我们投入生产生活的方方面面，也允许我们将其带到战场上配发给普通士兵。"
 FE_potion_enhanced_injection: "强化针剂"
 FE_potion_enhanced_injection_desc: "将魔药以注射而非口服的方式送入体内可以令使用者以较高的速度获得魔药的增益，但是容易造成血液成分的混杂而导致血魔法或疗愈魔法无法生效，此外，频繁注射还需要在静脉上置管以减少对其他组织的伤害。"
 FE_potion_aerosolization: "高效雾化"
 FE_potion_aerosolization_desc: "采用微型震荡法阵配合一定机械结构的方式，我们可以令液态魔药以给定的频率形成气溶胶，持续或快速地给予士兵增益。此外，如果加装负面药物甚至毒药还可以安装在傀儡身上对敌军造成影响。"
 FE_potion_microcapsule: "魔药微囊"
 FE_potion_microcapsule_desc: "在制备过程中预先将魔药有效成分封装于载体或包覆型辅料中，使其在服用后缓慢释放，避免了快速摄入大量魔药的副作用的同时确保药物能在最佳生效浓度下保持数个小时的时间。"
 FE_potion_implanted_organ: "内置器官"
 FE_potion_implanted_organ_desc: "经改造手术在体内安装一个生物相容性高的特殊注射工具，在每月定期补充药物的前提下可以便利地激活以提高士兵作战效能，而无须进行口服或吸入等额外动作。"
 FE_potion_cursing_technique: "诅咒技法化用"
 FE_potion_cursing_technique_desc: "由于对诅咒机理的分析，如今可以做到借助少量使用者生物组织的情况下勾连魔能界投影，在无需服用药物的情况下通过诅咒类技法将魔药有效成分直接作用于靶向器官，进而令受术者无负担地获得增益……也可能是减益。"
 FE_potion_pack_beast: "大承重驼兽"
 FE_potion_pack_beast_desc: "经过驯化和改良后的温顺魔兽可以用于负载大量的物资进行长距离运输，缺点是速度与承重量和耐力三个属性不可兼得，而且大部分魔兽吃得多拉的也多。"
 FE_potion_heavy_engine: "重型魔能引擎"
 FE_potion_heavy_engine_desc: "对魔能发动机的优化最终产生了能够运载数十吨货物的高重量高出力的魔能引擎，这意味着我们的铁马能够在魔兽都会感到厌倦的超长路程上稳定地运输各种物资，只是其在山区丘陵间的适应性不如驼兽。"

 #====================== 四、卡车及机械化线 ======================#
 FE_vehicle_light_armored_cavalry: "轻装甲铁骑"
 FE_vehicle_light_armored_cavalry_desc: "安装了少量装甲的单兵载具，具有高超的移动性，由于采用了近地悬浮引擎等设备具有比普通骑兵更高的机动性，因此比普通的骑兵更适合镇压或侦察。"
 FE_vehicle_armored_personnel_carrier: "全装甲运兵车"
 FE_vehicle_armored_personnel_carrier_desc: "给重型运输载具安装上护甲用于保护士兵的车辆，一定程度上兼顾了机动性和安全性。"
 FE_vehicle_elemental_magic_car: "元素魔导车"
 FE_vehicle_elemental_magic_car_desc: "经过化身元素或元素附魔等方式高效避免敌军火力袭击的载具，由于自身特性速度有所削减，但是防护水平和附加火力有效提升了，除了运兵也可以直接参与战斗而无需担心被直射火力快速摧毁。此外，许多迹象也证明需要一批能够运输士兵同时为他们提供即时火力支援的载具。"

 #====================== FE 步兵科技·设计稿新增科技本地化（科研-步兵.drawio）======================#
 FE_infantry_alchemy_standardization:0 "炼金规范化"
 FE_infantry_alchemy_standardization_desc:0 "对炼金反应的标准流程、魔药配比与魔导材料的品质检验进行统一规范并形成制度，使相关工艺摆脱工匠个人经验的束缚，为各类魔导装备与魔药的规模化量产铺平道路。"
 FE_potion_nasal_powder:0 "鼻用粉雾剂"
 FE_potion_nasal_powder_desc:0 "将浓缩魔药与助溶剂研磨成极细粉末，借助特制吸入器经鼻腔快速吸收，可在不依赖静脉注射的情况下迅速生效，大幅降低士兵在战场上的给药难度。"
 FE_vehicle_semi_hovering:0 "半悬浮载具"
 FE_vehicle_semi_hovering_desc:0 "在重型魔能引擎的基础上进一步优化近地悬浮阵列，使载具在保持较高运载能力的同时获得更强的越障能力与全地形机动性。"
