 FE_news.16.a: "千钧一发"
 FE_news.17.t: "温德米尔女公爵遇刺身亡"
 FE_news.17.desc: "安费丽丝·温德米尔女公爵昨夜于宅邸遇刺身亡。据目击者称，行凶者佩戴蒸汽甲胄突破了公爵宅邸严密的防御系统，并在现场遗留下深池组织的双剑纹章。\n\n公爵原定下月访问伦蒂尼姆议会就当前紧张局势进行商讨，现其军事指挥部已经紧急接管混乱局面并宣布温德米尔公爵领启动全域戒严，同为两大边防公爵之一的威灵顿公爵尚未发表声明，与此同时一些小道消息正在流传萨卡兹自治领地在刺杀事件前后的异常变化。"
 FE_news.17.a: "令人不安"

 FE_news.18.t: "[TIA.GetName]统一国民信仰"
 FE_news.18.desc.Akua: "今天，即[GetDateText]，帝国皇帝[TIA.GetLeader]在帝都[10.GetCapitalVictoryPointName]宣布，[TIA.GetAdjective]所有宗教团体除水神阿库娅外，其他宗教团队均应停止活动。\n\n在过去的数月中，帝国境内的宗教冲突日益加剧，数次暴力事件导致数十人伤亡。皇帝[TIA.GetLeader]在讲话中表示：“我们必须团结一致，共同面对外敌的威胁。多神教的分裂只会削弱我们的力量。”\n\n此次统一国民信仰的决定得到了南方多数民众的支持，他们认为这将有助于国家的稳定与发展。然而，也有不少北方民众对此表示担忧，认为这可能侵犯了个人的信仰自由。\n\n国际社会对此事反应不一，[LAN.GetName]外交部发表声明称：“我们尊重[TIA.GetAdjective]人民选择自己信仰的权利，但也希望他们能够和平共处。”"
 FE_news.18.desc.Furina: "今天，即[GetDateText]，帝国皇帝[TIA.GetLeader]在帝都[10.GetCapitalVictoryPointName]宣布，[TIA.GetAdjective]所有宗教团体除水神芙宁娜外，其他宗教团队均应停止活动。\n\n在过去的数月中，帝国境内的宗教冲突日益加剧，数次暴力事件导致数十人伤亡。皇帝[TIA.GetLeader]在讲话中表示：“我们必须团结一致，共同面对外敌的威胁。多神教的分裂只会削弱我们的力量。”\n\n此次统一国民信仰的决定得到了北方多数民众的支持，他们认为这将有助于国家的稳定与发展。然而，也有不少南方民众对此表示担忧，认为这可能侵犯了个人的信仰自由。\n\n国际社会对此事反应不一，[LAN.GetName]外交部发表声明称：“我们尊重[TIA.GetAdjective]人民选择自己信仰的权利，但也希望他们能够和平共处。”"
 FE_news.18.desc.none: "今天，[GetDateText]，帝国皇帝[TIA.GetLeader]在帝都[10.GetCapitalVictoryPointName]宣布，[TIA.GetAdjective]所有宗教团体均应停止活动。\n\n在过去的数月中，帝国境内的宗教冲突日益加剧，数次暴力事件导致数十人伤亡。"
