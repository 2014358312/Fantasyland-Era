l_simp_chinese:
  #角色、人物
  FES_Tanya_von_Degurechaff: "谭雅·冯·提古雷查夫"
  FES_Edelgard_von_Hresvelg: "艾黛尔贾特"
  FES_Edelgard_von_Hresvelg_leader_desc: "§L统帅部近日发布诏书：为表彰§Y艾黛尔贾特·冯·弗雷斯贝尔古§!少校在前线战役中的卓越功勋——其率部解救魔导大队、斩首敌军高级指挥官并缴获重要战略情报——皇帝陛下特颁恩诏，晋封冯·弗雷斯贝尔古少校为“胜利公爵”，并授予新大陆殖民地总督全权，统辖殖民地一切军政事务。§!"
  FES_hans_von_zettour: "汉斯·冯·泽图尔"
  FES_hans_von_zettour_desc: "§L帝国军第九军团参谋部参谋长。汉斯·冯·泽图尔的军旅生涯几乎比军团里的所有人都长，30年的参谋经历让他对一只部队从组件到投入战斗每个环节都了如指掌，但也锻炼了其推卸责任和扯皮的本事，随着年龄的增长，其与指挥官的矛盾不降反增，在第九军团在旧大陆因重大损伤调往殖民地调整后，不知出于何种原因，与新上任的军团长库尔特相处融洽了起来。§!"
  FES_Kurt_von_Rudersdorf: "库尔特·冯·鲁德斯多夫"
  FES_Kurt_von_Rudersdorf_desc: "§L作为帝国军第九军团军团长。库尔特远谈不上军事天才，翻开档案，也只能找到繁多的职务调动和任务记录，作为一步一步爬上来的高级将领，第九军团是他人生的顶点。也几乎是终点，在很多人看来，库尔特豪爽，大方，经验丰富，为人老实。在以前时候这几乎就是正确的评价，但据如今的下属军官来看，库尔特却是官僚气十足。尽管他依然常在公共场合演绎自己的往日形象，但殖民地的安逸生活也确实改变了他。§!"

