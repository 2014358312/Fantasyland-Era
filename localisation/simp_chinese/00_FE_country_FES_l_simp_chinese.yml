  FES_fascism_party_long: "爱国者（总动员）\n§W--------------------------------§!\n§L祖国生死存亡，每一个人都是爱国者，无论立场左右，无论他承认与否。§!"

  #ideas
  FES_idea_attachment_to_homeland: "故土难离"
  FES_idea_attachment_to_homeland_desc: "当最后一艘载满帝国流亡者的轮船靠岸新大陆时，船上的人们仍然相信这只是一次暂时的避难。他们带着祖宅的钥匙、家族肖像画和一袋袋伯卢的泥土，仿佛随时准备启程返乡。\n\n数年过去了。传送门另一端的帝国故土已沦为魔域，任何派遣回去的侦察队要么杳无音信，要么带回令人绝望的报告——菲茵河的水已被魔能污染，伯卢的白石建筑群化作焦黑的废墟，万神殿的穹顶坍塌在荒草之中。\n\n然而，殖民地的心脏始终没有真正扎根在这片土地上，殖民地的行政体系仍沿袭帝国末期的架构，除了总督，官员们的头衔前缀依然是“殖民地式头衔”——殖民地法官、殖民地税务官。没有人愿意接受“独立”这个词汇，因为那意味着承认帝国已死。每一次议会开幕，都会有人提议“等待合适的时机重返本土”，尽管所有人都知道这个时机永远不会到来，更不会有人在意去保卫这个垂死的海外枯枝。"
  FES_idea_wartime_state_of_emergency: "战时紧急状态"
  FES_idea_wartime_state_of_emergency_desc: "“秩序不是选择，而是生存的唯一路径。在这片被遗忘的土地上，枪托比选票更能塑造明天。”\n\n帝国覆灭的消息传来时，新大陆殖民地正处于一场严重的粮食危机之中。文官在绝望中饮弹自尽，行政体系濒临瘫痪，囤积在港口的物资被饥民哄抢。正是在这片混乱中，第九军团残部的高级军官团接管了政权。\n\n他们宣布实施“战时紧急状态”，并承诺“一旦本土恢复联络，立即还政于民”。数年过去了，紧急状态依然有效。"
  FES_idea_declining_imperial_authority: "衰落的皇权"
  FES_idea_declining_imperial_authority_desc: "陛下仍在宫中，御座仍在原处，但朝臣们商议国事时，已不再派人去请示圣意。"
  FES_idea_army_primacy: "陆权优先"
  FES_idea_army_primacy_desc: "“天空是懦夫的庇护所，海洋是商人的通道。唯有坚实的土地，才是勇士决死之地。”——第九军团作战条例扉页铭文，旧历538年版\n\n第九军团是帝国覆灭时唯一完整保存建制的野战军团。它的军官团在新大陆召开了著名的“橡木桌会议”，会上达成了一项共识：殖民地的一切资源必须优先服务于陆军建设。理由有三—\n\n其一，新大陆的原住民部落虽然已被击溃，但仍有广袤领土未被探索；其二，魔族随时可能跨越海洋追击而至，届时唯一的依靠就是地面部队的血肉长城；其三，也是从未明说的一点：陆军是政府的权力根基，削弱陆军无异于自掘坟墓。"
  FES_idea_imperial_industrial_enterprises: "帝国工业企业"
  FES_idea_imperial_industrial_enterprises_desc: "“每一颗螺丝钉上都刻着双头鹰，每一台机床都记得伯卢的晨光。我们可以离开故土，但帝国的工业灵魂从未离开过我们。”\n\n帝国覆灭前夕，精明的皇家财务大臣预见到了最坏的结局。他以“加强新大陆殖民地防御能力”为名，秘密启动了一项代号“火种”的行动——将帝国本土最精华的工业设备拆卸装箱，分批运往新大陆。\n\n这项行动持续了整整三年。旧历561年至564年间，共计一百二十七艘货船满载着机床、锻压机、熔炉图纸和熟练技工，穿越风暴肆虐的远洋航线抵达新伯卢港。当最后一艘船靠岸时，码头上堆积的板条箱足以填满三个街区。"