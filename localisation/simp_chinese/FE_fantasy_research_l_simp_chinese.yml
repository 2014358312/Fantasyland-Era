 FE_BEHEMOTH_TITLE_5:0 "泰坦与巨灵"
 FE_AUTOMATA_TITLE_1:0 "魔核与灵能"
 FE_AUTOMATA_TITLE_2:0 "魔像与异闻"
 FE_AUTOMATA_TITLE_3:0 "巨构与神兵"
 fe_personal_flight_vehicle:0 "个人飞行载具"
 fe_personal_flight_vehicle_desc:0 "最初将个人送上天穹的尝试——以魔能为动力的小型飞行装置，虽简陋却开启了制空的时代。"
 fe_mana_boat:0 "魔能艇"
 fe_mana_boat_desc:0 "以魔能炉驱动浮空艇身，可搭载数人进行短途航行，是各国民用与军用航空共同的起点。"
 fe_armored_mana_boat:0 "装甲魔艇"
 fe_armored_mana_boat_desc:0 "为魔能艇加装护甲与武装，使其从运输工具蜕变为真正的作战平台。"
 fe_demonrealm_dart:0 "魔界尖梭"
 fe_demonrealm_dart_desc:0 "借鉴魔界生物流线躯体打造的极速穿梭艇，在天际来去如电。"
 fe_air_cavalry:0 "空骑兵"
 fe_air_cavalry_desc:0 "骑乘飞行魔兽或浮空鞍具的空中骑手，其机动范围远超地面部队。"
 fe_traditional_aircraft:0 "传统构想飞行器"
 fe_traditional_aircraft_desc:0 "凝结数代工匠对扑翼、滑翔、旋翼等古老构想的实践成果。"
 fe_drag_reduction_fighter:0 "褪阻力战机"
 fe_drag_reduction_fighter_desc:0 "以术式削减空气阻力的固定翼战机，速度与机动性大幅提升。"
 fe_multipurpose_aircraft:0 "泛用飞行器"
 fe_multipurpose_aircraft_desc:0 "一机多用的通用航空平台，可依模块换装执行侦察、护航与对地任务。"
 fe_sky_warship:0 "空中战舰"
 fe_sky_warship_desc:0 "依托大型浮空法阵建造的空中巨舰，是游弋于天际的移动堡垒。"
 fe_sky_island:0 "空岛"
 fe_sky_island_desc:0 "稳定悬浮的大型空域平台，可作为舰队锚地与前线补给枢纽。"
 fe_aerospace_carrier:0 "空天母舰"
 fe_aerospace_carrier_desc:0 "搭载并投放飞行器的浮空母舰，让舰队真正拥有移动的机场。"
 fe_stratospheric_fortress:0 "同温层堡垒"
 fe_stratospheric_fortress_desc:0 "常驻高空同温层的巨型要塞，俯瞰大地，难以企及。"
 fe_small_levitation_circle:0 "小型悬浮法阵"
 fe_small_levitation_circle_desc:0 "标准化量产的小型悬浮法阵，是一切浮空装置的动力基石。"
 fe_antigravity_formation:0 "反重力术式"
 fe_antigravity_formation_desc:0 "逆转重力的进阶术式，让前所未有的庞然大物得以离开地面。"
 fe_high_speed_engine:0 "高速引擎"
 fe_high_speed_engine_desc:0 "将魔能爆发转化为持续推进力的引擎，为飞行器注入速度。"
 fe_omnidirectional_engine:0 "全向机动引擎"
 fe_omnidirectional_engine_desc:0 "可全向偏转喷流的机动引擎，赋予飞行器鬼魅般的航迹。"
 fe_front_layout:0 "前置布局"
 fe_front_layout_desc:0 "将武备布置于机体前部的布局方案，利于直接对准目标射击。"
 fe_rear_layout:0 "后置布局"
 fe_rear_layout_desc:0 "将武备与观瞄后置的布局方案，兼顾防御与广域覆盖。"
 fe_quickmount_ballista:0 "快装弩机"
 fe_quickmount_ballista_desc:0 "标准化的速装弩炮发射机构，让轻型飞行器也能拥有致命火力。"
 fe_rapidfire_magic_device:0 "速射魔导器"
 fe_rapidfire_magic_device_desc:0 "以魔能供弹的速射魔导炮，是天空中泼洒弹幕的核心武备。"
 fe_aerial_bomb:0 "航弹"
 fe_aerial_bomb_desc:0 "由空中投掷的爆炸物，让飞行器成为悬在要塞头顶的利剑。"
 fe_loitering_munition:0 "巡飞弹"
 fe_loitering_munition_desc:0 "可长时间盘旋搜索目标并自行俯冲攻击的自律魔导兵器。"
 fe_central_command_aircraft:0 "中枢指挥机"
 fe_central_command_aircraft_desc:0 "作为空中指挥中枢的载机，统一调度整片空域的作战单位。"
 fe_air_ground_integration:0 "空地一体机"
 fe_air_ground_integration_desc:0 "专司空地协同的引导机种，将空中火力精准嫁接到地面战线。"
 fe_autonomous_combat_fairy:0 "自律战斗妖精"
 fe_autonomous_combat_fairy_desc:0 "以妖精为核心、可自主判断目标的自律战斗单元，是航空术的终极结晶。"
 fe_mundane_beast_cavalry:0 "凡兽骑兵"
 fe_mundane_beast_cavalry_desc:0 "骑乘寻常战马的骑兵部队，是一切驯兽之学的源头。"
 fe_beast_tamer:0 "驯兽者"
 fe_beast_tamer_desc:0 "与兽群朝夕相处的驯兽师，掌握让野兽服从的古老技艺。"
 fe_transformation_spell:0 "变形术"
 fe_transformation_spell_desc:0 "强化或重塑野兽形体的变身法术，使坐骑的力量更上一层。"
 fe_nature_favored:0 "自然眷属"
 fe_nature_favored_desc:0 "与自然立约的血脉与仪式，让林间生灵愿意为盟友而战。"
 fe_children_of_the_forest:0 "森林之子"
 fe_children_of_the_forest_desc:0 "深谙林地的各族猎手与兽伴，在密林中来去无踪。"
 fe_green_hell:0 "绿色地狱"
 fe_green_hell_desc:0 "将整片丛林化为战场的能力——熟悉每一寸苔藓的己方，与迷失其中的敌人。"
 fe_exotic_beast_taming:0 "异兽驯化"
 fe_exotic_beast_taming_desc:0 "系统化驯化魔兽等异种野兽的学问，危险但回报丰厚。"
 fe_magicbeast_cavalry:0 "魔兽骑兵"
 fe_magicbeast_cavalry_desc:0 "骑乘魔兽冲锋的重装骑兵，冲击力远超凡兽。"
 fe_call_of_the_wild:0 "野性呼唤"
 fe_call_of_the_wild_desc:0 "唤醒荒野生灵支援战场的号角与仪式。"
 fe_beastsoul_blessing:0 "兽灵护佑"
 fe_beastsoul_blessing_desc:0 "请兽灵附佑骑士与坐骑的祝福，使其在战场上勇气倍增。"
 fe_ancestors_are_calling:0 "祖先在召唤"
 fe_ancestors_are_calling_desc:0 "追随先祖猎魂的召唤，整支部队如一人般协同狩猎。"
 fe_fullyarmored_heavy_cavalry:0 "全甲重骑"
 fe_fullyarmored_heavy_cavalry_desc:0 "人马俱甲的重装骑兵，是碾碎战线的铁锤。"
 fe_raging_behemoth:0 "狂暴巨兽"
 fe_raging_behemoth_desc:0 "以秘术激怒并驱使的巨型战兽，所过之处墙垣俱碎。"
 fe_truedragon_rider:0 "真龙骑手"
 fe_truedragon_rider_desc:0 "与真龙缔约并乘其翱翔战场的少数勇者。"
 fe_emperors_credentials:0 "帝王之证"
 fe_emperors_credentials_desc:0 "唯有支配万兽者方能持有的权柄，象征对巨兽军团的绝对统御。"
 fe_dragons_nest:0 "巨龙之巢"
 fe_dragons_nest_desc:0 "寻得并经营龙的巢穴，自龙蛋时代便开始培育眷龙。"
 fe_bio_alchemy:0 "生体炼金"
 fe_bio_alchemy_desc:0 "以炼金术拼接、强化生物躯体的禁术，巨兽由此愈发可怖。"
 fe_chimera:0 "奇美拉"
 fe_chimera_desc:0 "融合多种魔兽精华而成的合成巨兽，堪称生体炼金的巅峰。"
 fe_beneath_the_dragon:0 "异龙之下"
 fe_beneath_the_dragon_desc:0 "侍奉并驱使异龙种群的秘仪，龙威笼罩之处敌军胆寒。"
 fe_titan_spirit:0 "泰坦巨灵"
 fe_titan_spirit_desc:0 "唤醒沉眠大地的泰坦残灵，化不可能的巨物为可能。"
 fe_titanism:0 "巨灵观"
 fe_titanism_desc:0 "研究巨灵存在方式的学说，使人与巨灵的联结愈发稳固。"
 fe_jormungandr:0 "耶梦加德"
 fe_jormungandr_desc:0 "环世巨兽的真名——当它苏醒，战场本身都会为之倾覆。"
 fe_basic_craft_puppet:0 "基础工艺傀儡"
 fe_basic_craft_puppet_desc:0 "以木石与基础魔纹驱动的傀儡，承担杂役与简单劳作。"
 fe_powertrain_optimization:0 "动力系统优化"
 fe_powertrain_optimization_desc:0 "对魔能传动机构的整体改良，傀儡的力量与续航大增。"
 fe_micro_core_puppet:0 "微型魔核傀儡"
 fe_micro_core_puppet_desc:0 "以微型魔核替代笨重机关的小型傀儡，灵活而廉价。"
 fe_high_intelligence_core:0 "高智能核心"
 fe_high_intelligence_core_desc:0 "具备学习能力的高阶魔核，傀儡开始真正理解命令。"
 fe_anti_interference_sealing:0 "防干扰封装"
 fe_anti_interference_sealing_desc:0 "保护魔核免受灵能与敌性术式干扰的封装工艺。"
 fe_psychic_reshaping_puppet:0 "灵能重塑傀儡"
 fe_psychic_reshaping_puppet_desc:0 "以灵能重塑傀儡的心智，使其行动近乎生灵。"
 fe_deathspirit:0 "死魂灵"
 fe_deathspirit_desc:0 "将逝者残魂缚入傀儡的秘术——争议与力量并存。"
 fe_inscribed_golem:0 "雕纹魔像"
 fe_inscribed_golem_desc:0 "满刻战纹的石铁魔像，是工坊与战线的忠实守卫。"
 fe_golem_frame_simplification:0 "魔像框架简化"
 fe_golem_frame_simplification_desc:0 "简化魔像构造以降低成本，让量产大军成为可能。"
 fe_multi_leg_steel_beast:0 "多足钢铁兽"
 fe_multi_leg_steel_beast_desc:0 "如兽般奔驰的多足钢铁造物，地形对它毫无意义。"
 fe_position_expansion:0 "定位扩展"
 fe_position_expansion_desc:0 "扩展傀儡的职能定位——从苦力，到哨兵，再到战士。"
 fe_spacetime_voyage:0 "超时空奇旅"
 fe_spacetime_voyage_desc:0 "令傀儡跨越空间投送的传送术式，钢铁军团凭空而至。"
 fe_possession_spirit:0 "附身魔灵"
 fe_possession_spirit_desc:0 "请魔灵附身傀儡核心，赋予其狡诈与直觉。"
 fe_void_nightmare:0 "虚空梦魇"
 fe_void_nightmare_desc:0 "触碰虚空的最终造物——它的存在本身即是噩梦。"
 fe_heavy_golem:0 "重型魔像"
 fe_heavy_golem_desc:0 "为战争而铸造的重型魔像，是移动的钢铁壁垒。"
 fe_war_megastructure:0 "战争巨构"
 fe_war_megastructure_desc:0 "以整座工坊之力建造的战争巨构，一具便可镇压一域。"
 fe_roaring_king:0 "咆哮之王"
 fe_roaring_king_desc:0 "装备音波咆哮装置的巨像之王，吼声所及敌军披靡。"
 fe_selfrepair_carrier:0 "自修复载体"
 fe_selfrepair_carrier_desc:0 "具备自我修复能力的载体，在漫长的战役中越战越坚。"
 fe_intelligence_implantation:0 "智能灌输"
 fe_intelligence_implantation_desc:0 "将战术知识直接灌输进魔核的工艺，让量产单位拥有老练。"
 fe_titan_godsoldier:0 "巨神兵"
 fe_titan_godsoldier_desc:0 "以神话为蓝本铸造的神躯巨兵——自动机之学的终点。"
