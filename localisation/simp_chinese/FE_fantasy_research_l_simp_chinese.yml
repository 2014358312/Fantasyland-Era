l_simp_chinese:
 fe_air_folder:0 "幻想航空"
 fe_air_folder_desc:0 "从个人飞行载具到空天母舰——幻想世界的制空之学。"
 fe_behemoth_folder:0 "战争巨兽"
 fe_behemoth_folder_desc:0 "驯兽、骑兵与巨兽的战争之学。"
 fe_automata_folder:0 "自动机"
 fe_automata_folder_desc:0 "傀儡、魔像与战争巨构的造物之学。"
