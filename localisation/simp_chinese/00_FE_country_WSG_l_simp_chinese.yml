 WSG_dark_day: "黑暗日"
 WSG_dark_day_desc: "我们曾一次次地指望当局作出行动，得到的却是一次又一次的失望。我们已经受够了政府的软弱无能，这个政府不配存在！"
 WSG_rancor_and_blood: "仇与血"
 WSG_rancor_and_blood_desc: "深海杀害我们的人民，毁坏我们的工厂，摧残我们的身心，而那些高高在上的掌权者就TM干看着。"
 WSG_hate_propaganda: "护国行动"
 WSG_hate_propaganda_desc: "幻萌是我们生活的国度，我们不允许任何人使她蒙受磨难。如果有，不论是外部的敌人，还是内部的败类，我们都将毫不妥协！"
 WSG_revenge_fever: "复仇狂热"
 WSG_revenge_fever_desc: "是谁能击退深海的入侵？是军队！是谁能铲除国家的败类？是军队！是谁配得上主导国家？是军队！"
 WSG_the_rise_of_militarism: "军国崛起"
 WSG_the_rise_of_militarism_desc: "有太多太多的背叛了，我们军队定要让叛徒血债血偿！"
 WSG_letter_to_the_admiral: "上书提督"
 WSG_letter_to_the_admiral_desc: "提督仅仅能起到个花瓶的作用，但碍于舰娘对他的喜爱，直接做掉他又不合适。要不就用一次“上书”来让提督“体面地”接受我们的“请求”。"
 WSG_convincing_the_secretary_ship: "说服秘书舰"
 WSG_convincing_the_secretary_ship_desc: "秘书舰还高坐在政府中，不过是得到了提督的青睐，有什么了不起的。既然她不愿让权，那就让她只能坐在办公室里盖章吧~"
 WSG_right_full_rudder: "右满舵"
 WSG_right_full_rudder_desc: "我们军队已经全面接管了政府，现在我们宣布：幻萌，幻萌，幻萌高于一切！"
 WSG_expedited_production: "加急生产"
 WSG_expedited_production_desc: "现在幻萌的军工产能还远远不够。不行，军政府发话了，加急生产军备。"
 WSG_war_zone: "战争港区"
 WSG_war_zone_desc: "我们要对产业占比进行调整，扩大军备的生产。"
 WSG_military_fanaticism: "军事狂热"
 WSG_military_fanaticism_desc: "我们是一支拥有国家的军队。一切都要为军事让步，一切都要为军事服务！"
 WSG_bloodshed_march: "喋血行军"
 WSG_bloodshed_march_desc: "幻萌军向敌国土地开进\n口中唱响魔鬼之歌\n一名射手伫立卡莱纳港\n低声跟着一同哼唱\n世间上下，我们不屑一顾\n任凭这整个世界\n诅咒我们，或是称颂我们\n一切随他们心意\n凡我所至，唯有向前\n魔鬼也在一旁放声大笑！\n哈，哈，哈，哈，哈！\n我们为幻萌而战\n我们为幻萌而战\n敌人永无宁息\n无数战役我们早已浴血\n北南东西，四方征战\n如今我们整装待发\n对抗敌人的瘟疫\n幻萌军永不停歇，我们要毁灭一切\n直到无人扰乱幻萌的福祉\n纵使队伍不断减员\n对我们而言，绝无后退可言\n凡我所至，唯有向前\n魔鬼也在一旁放声大笑！\n哈，哈，哈，哈，哈！\n我们为幻萌而战\n我们为幻萌而战\n敌人永无宁息。"
 WSG_go_to_war: "出征！"
 WSG_go_to_war_desc: "从日出之地到日落之地，幻萌将用剑为她的犁开辟更多的土地！"
