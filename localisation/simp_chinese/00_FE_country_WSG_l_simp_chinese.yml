 WSG_event.008.t: "[WSG_from_the_deep_sea_attack.GetName]遭到袭击"
 WSG_event.008.d: "“呼叫总部，这里是[WSG_from_the_deep_sea_attack.GetName]守备队。我部正在遭到攻击，重复，我部正在遭到攻击。”\n（轰！…… 呜 ————）\n“请求火......支——\n（轰！）\n滋啦！噼啪 —— 沙沙 ————"
 WSG_event.008.a: "......"
 WSG_event.009.t: "直面深海"
 WSG_event.009.d: "（这天，乌云密布。幻萌的西部海洋上，深海的部队黑压压一片，大和站在队伍前面，确认着最终的作战方案）\n“俾斯麦，欧根，你们是主力，务必要突破防线，站稳脚跟。小北方，提供空中支援。潜艇栖姬，带队封锁海域。还有运输酱——保管好内裤。”\n\n（港区内，我，秘书舰和各部部长召开紧急会议）\n“前线怎么样了？”我看着敌情报告，沉默了许久，而后开口问道。\n“不容乐观，军队长期缺乏训练，即使有制定紧急作战方案，但预估无法阻止深海登录。”\n全场陷入沉默。\n“那居民的疏散工作呢？”我看向行政部长。\n“虽然深海有预告，但是很多人出于恐惧直接关门不出。我们的疏散工作进展缓慢。”\n沉默再次笼罩了会场，而窗外的乌云貌似更加阴沉，仿佛随时要把港区吞噬。\n“呃......那......我们的经济应该不会——”\n“已在附近海域发现大量深海潜艇，恐怕一旦开战，我们的贸易就将被封锁。”\n“轰隆！沥沥沥沥——”乌云终于控制不住自己的力量，为港区降下雷雨。\n\n“......”"
 WSG_event.009.a: "“所有人，保持冷静，按部就班”"
 WSG_event.009.b: "“我将发表演讲”"
 WSG_event.009.c: "“人已懵逼，不要烦我”"
 WSG_event.010.t: "灯下报告"
 WSG_event.010.d: "夜晚的港区，夜色凝重，寒风呼啸，徒留办公室的灯光无力地亮着。\n我手里握着报告，在门外站立静候，屏息凝神。\n“咚咚。”......\n“进。”\n我推开门，将其轻轻关上，随后立刻按军姿站立，等看到指挥官抬手后，齐步走到桌前两步处，站立，行礼。\n“同志指挥官！西部战区值班汇报员，前来呈递前线战况书面报告！”我保持站立，目视前方，身体微微发抖。\n长官微微抬手。\n见状，我恢复立正姿势，随后将文件双手平拖，置于桌面，然后向后半步，立定，站立。\n“汇报前线战况。”长官一边拿起报告，一边发出命令。\n“是！”我吞咽口水，瞟了一眼旁边做记录的副官，\n“我军防守地段：西部海岸，主防御工事损毁严重。但阵地仍在我军控制下。”（沙沙沙）\n“人员：现有战斗人员145429人；阵亡279357人，重伤8624人，轻伤30046人，伤员已后送医疗点。武器装备详情写在附件。弹药剩余0.2基数，舰装损毁严重。”（沙沙吱——）\n“敌情：发现深海大规模调动，”我眼睛微微向下，发现长官面色发白，手指微微颤抖，但我不敢多想，收回注意力，生怕说错什么，“但暂无进攻迹象。”\n“依据是什么？”长官突然打断我的话。\n“是，”我内心发慌，怔了一下，“观测点位暂未发现敌军部队。”\n“也——继续。”长官捏紧报告，命令我继续说。\n“补给：粮食与饮用水短缺，急救物品不足。”\n“我方请求：申请补充粮食，水，钢铁，燃油，弹药，人员。”"
 WSG_event.010.a: "战争时期，谁都不好过。"
 WSG_event.010.b: "下令补充，并汇报提督，请求他发表慰问演说。"
 WSG_event.010.c: "即刻下令补充。"
