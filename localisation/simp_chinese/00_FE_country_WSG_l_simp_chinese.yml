 WSG_event.001.t: "停滞上国"
 WSG_event.001.d: "这本应是平常的一天，天空像往常一样晴朗，鲜花像往常一样芬芳，鸟儿像往常一样歌鸣。提督和我漫步于港区。干什么？不干什么，就只是单纯地享受这宁静的时光。\n“提督，待会儿去哪儿？”我揽着提督的手臂（让提督能感受到我的胸），看着他的脸。\n“这......”提督躲着我的眼睛稍微犹豫了一下，“要不——”\n“滴滴滴滴，滴滴滴滴”\n提督从口袋里拿出通讯器，是秘书舰来电。\n“喂，有什么事吗？......什么？......好。”通讯器那头的声音越发慌忙，提督的脸色也跟着愈发难堪。\n“提督，发生什么事了吗？”\n“没事，不过——哦~”提督一个踉跄，摔倒在地上。\n“不过今天天气好像有点热，咱们先回吧。”狼狈爬起的提督拍了拍灰尘，转身就要走。\n“唉唉唉！我还没——”拍拍屁股的提督一溜烟儿就跑没了。\n（一段时间后）（下面主语变到秘书舰）\n“那家伙，平时跟舰娘约会的时候都猴急猴急的，这一到关键时刻就没了人影。”我看着侦查员发的紧急汇报，焦急地来回踱步。\n“怎么还——”“嘭。”提督喘着粗气，推门而入。\n“深海——要——”\n“你自己看吧。”我将汇报单递给提督，“现在在海上又侦测到大量深海的踪迹，可以看出来，她们在集结部队，我们综合各方数据推测，入侵将在一年后开始。”\n“一年！？可我们根本——”\n“根本没有做好准备。”我将双手叉到胸前，“谁叫你天天不干正事，我们的军事，经济可是全面落后。”\n“那咋办？”提督颤巍巍地看向我。"
 WSG_event.001.a: "咋办？改啊！"
 WSG_event.002.t: "说服秘书舰"
 WSG_event.002.d: "暂时不知道写点啥喵！~"
 WSG_event.002.a: "秘书舰同意了！"
 WSG_event.003.t: "上书提督"
 WSG_event.003.d: "暂时不知道写点啥喵！~"
 WSG_event.003.a: "提督同意了！"
 WSG_event.004.t: "港区与明天"
 WSG_event.004.d: "哔——哔哔哔哔哔哔——哔哔哔哔哔哔——哔——哔——哔——（幻萌国家新闻的开头）\n观众朋友们晚上好，欢迎收看幻萌国家新闻，下面向您播报本次新闻的全部内容：\n改革之风吹港区，幻萌人民真争气。纪念幻萌改革一周年暨表彰大会于今日举办。\n总台消息：今日上午8点，纪念幻萌改革一周年暨表彰大会于皮兰港顺利举办。大会总结一年的改革成果，提督发表重要讲话：\n“在之前的一年中，幻萌各部人员在改革的总体思路下充分发挥主观能动性，各项改革成果显著。但这只是开始，接下来，我们——”（信号被干扰）\n\n（一段时间后信号回复，但是......）\n“啊，连上了。大和？”\n（此时的大和正在逗一只运输酱，听到声音后迅速跑来，留下运输酱杵在那里发呆）\n“来啦来啦——”大和小跑过来，边跑边整理衣装。长舒一口气，打开了摄像头。\n（屏幕上出现了大和的身影）\n“幻萌的各位，你们好，我是深海旗舰大和号。相信通过各种方式，你们已经得知我们即将去你们那边‘串个门’，希望你们已经准备好接待我们了，到时候可别让客人失望哦~”说罢，大号关掉了摄像头。\n\n“我是不是有点太紧张了？”\n“呃......”"
 WSG_event.004.a: "“这个时候就不要考虑这些了吧！”"
