 WSG_reorganizing_the_economy: "重整经济"
 WSG_reorganizing_the_economy_desc: "在长期的萧条下，幻萌工厂停工，失业率居高不下。这样下去，幻萌的经济就要彻底完蛋啦。提督呢，提督呢？救一下啊。"
 WSG_reassure_the_public: "安抚民众"
 WSG_reassure_the_public_desc: "与深海战争的创伤至今都没有恢复，尤其是民众心中的恐惧。如今深海又将进犯，如果我们不能安抚民众，消解其恐惧心理，只怕是人心惶惶不可终日。"
 WSG_industrial_development: "扶持重工业"
 WSG_industrial_development_desc: "有了炼钢厂，我们才能制造装备保卫国土，有了水泥厂（建造部门），我们才能发展工业，有了拖拉机厂，我们的农业才能规模化。"
 WSG_pursue_progress_while_ensuring_stability: "提振消费工业"
 WSG_pursue_progress_while_ensuring_stability_desc: "作为经济发展的三架马车之一，提高消费水平将极大地增强经济活力。为此我们应对消费品进行投资以促其发展。"
 WSG_to_bide_ones_time: "复兴工业基地"
 WSG_to_bide_ones_time_desc: "我们有不少曾经的工业区因年久失修，设备严重老化。我们应加大政策支持，更新设备。让工业基地发挥其规模效益，带动全国的经济发展。"
 WSG_inspire_social_vitality: "激发社会活力"
 WSG_inspire_social_vitality_desc: "战争与我们长期的不作为让整个社会死气沉沉，如此社会怎能抗住深海？必须行动起来，为社会注入活力。"
 WSG_leading_society: "引领社会"
 WSG_leading_society_desc: "舰娘们联邦中有着极高的影响力，由舰娘出面引导民众，发挥舰娘的引领作用来加强凝聚力。方能万众一心，齐抗深海。"
 WSG_focus_on_peoples_livelihood: "关注民生"
 WSG_focus_on_peoples_livelihood_desc: "在长期的忽视中，幻萌人民的生活水平几乎原地踏步。这不利于社会的稳定发展，幻萌的人民理应过上更好的生活。"
 WSG_livelihood_construction_projects: "民生建设项目"
 WSG_livelihood_construction_projects_desc: "公共基础设施，丰富的消费品，完善的社会保障。这些民生项目一旦落实，民众对当局一定竭诚欢迎。"
 WSG_economic_cycle: "经济内循环"
 WSG_economic_cycle_desc: "在外敌环伺的情况下发展外贸是不现实的。我们应努力挖掘国内潜力，以国内大循环为主体。"
 WSG_reorganize_the_military: "重组军队"
 WSG_reorganize_the_military_desc: "现在的幻萌打深海？打得过吗？打不过，没这个能力你知道吧。为什么？因为在长期的停滞摆烂下，幻萌军队已经落后了，军队的根子已经烂了。"
 WSG_rectify_army_discipline: "整顿军纪"
 WSG_rectify_army_discipline_desc: "军人的第一要务就是军纪严明，听从指挥。现在的军队简直是吊儿郎当的，这需要整顿。"
 WSG_strengthen_basic_training: "加强基础训练"
 WSG_strengthen_basic_training_desc: "无论战争如何变化，体能，堑壕挖掘，队列动作这些基础内容始终决定着一支军队的素质。"
 WSG_strengthen_collaborative_operations: "强化协同作战"
 WSG_strengthen_collaborative_operations_desc: "战争从不是单兵种的独秀，而是多兵种的协同配合。建立各兵种层级间的沟通渠道，加强协同训练方能打造一支高效的部队。"
 WSG_rectify_the_air_force: "整顿空军"
 WSG_rectify_the_air_force_desc: "现在的幻萌空军充斥着陈旧的机型与连飞机都不知道怎么开的飞行员，这需要整顿。"
 WSG_strengthen_training: "加强训练"
 WSG_strengthen_training_desc: "飞行员的飞行经验在空军体系中是至关重要的一环，开展广泛的飞行训练，加强飞行员的整体素质是重振空军的一大要务。"
 WSG_equipment_upgrade: "装备升级"
 WSG_equipment_upgrade_desc: "空军作战就怕装备出现代差，加强空军装备研发，加快淘汰老旧机型，加速装备升级，确保幻萌空军跟上时代。"
 WSG_naval_overhaul: "海军大修"
 WSG_naval_overhaul_desc: "如今的幻萌海军只剩荣耀之名，而无荣耀之实。对海军大规模的修整刻不容缓。"
 WSG_training_aviation_forces: "训练航空兵"
 WSG_training_aviation_forces_desc: "面对海上复杂的天气和高速机动的战舰，海军航空兵的命中率......5%就是王牌，这5%可需要刻苦地训练啊。"
 WSG_train_sailors: "训练水手"
 WSG_train_sailors_desc: "颠簸的海浪，糟糕的海况无不考验着水手的身心。我们要提高对水手的训练来确保他们适应海上环境。"
 WSG_complete_preliminary_reforms: "完成初步改革"
 WSG_complete_preliminary_reforms_desc: "经过一系列努力，国内改革已初见成效。深海，你放马过来！"

 WSG_port_area_planning: "港区企划"
 WSG_port_area_planning_desc: "进行统一的规划，依据各地区的区位优势因地制宜。实现区域间的分工合作，协调发展。"
 WSG_eastern_provinces: "企划：东方列省"
 WSG_eastern_provinces_desc: "东方聚集了幻萌的一批重要城市，规划东部省份的城镇建设。"
 WSG_eastern_special_economic_zone: "东方经济特区规划"
 WSG_eastern_special_economic_zone_desc: "在东部省份规划经济特区，引入资金，建成现代化城市圈。"
 WSG_western_provinces: "企划：西部列省"
 WSG_western_provinces_desc: "西部面向大洋，有便利的海运条件，规划西部省份的城镇建设。"
 WSG_western_mixed_industry: "西方混合工业规划"
 WSG_western_mixed_industry_desc: "利用海运优势在西部地区布局混合型工业基地，建成综合性工业中心。"
 WSG_southern_provinces: "企划：南疆列省"
 WSG_southern_provinces_desc: "南部是幻萌重要的造船基地，规划南部省份的城镇建设。"
 WSG_southern_shipyard: "南方大造船厂规划"
 WSG_southern_shipyard_desc: "扩建南部的造船厂，充分发挥集聚效益建成一批现代化造船厂。"
 WSG_northern_provinces: "企划：北境列省"
 WSG_northern_provinces_desc: "北部蕴藏着丰富的资源，规划北部省份的城镇建设。"
 WSG_northern_heavy_industry_base: "北方重工业基地规划"
 WSG_northern_heavy_industry_base_desc: "挖掘利用北部的资源，就地建设重工业基地，靠近原料产地，降低成本。"
 WSG_super_port_area: "超级港区"
 WSG_super_port_area_desc: "融一省为一城，建设超级港区。"

 WSG_restart_the_archive: "重启档案馆"
 WSG_restart_the_archive_desc: "在长期的不思进取中，幻萌有许多技术都已遗失，但或许档案馆中还有记录。"
 WSG_technical_potential: "技术蕴藏"
 WSG_technical_potential_desc: "我们已取得了不少理论突破，现在是时候落实到实处。"
 WSG_special_project: "特殊项目"
 WSG_special_project_desc: "尖端的技术有重大的利用价值，我们应重视这些特殊项目，走在时代前列。"
 WSG_resource_synthesis: "资源合成"
 WSG_resource_synthesis_desc: "幻萌的资源长期依赖贸易，但战端一开，贸易中断，工业生产就会受到影响。为此我们应减少对外资源依赖，人工合成技术是一个可行项。"
 WSG_port_area_academy_of_sciences: "港区科学院"
 WSG_port_area_academy_of_sciences_desc: "科技是第一生产力。为了加强幻萌的科技实力，我们将建立港区科学院来攻克科研难题。"
 WSG_port_engineering_institute: "港区工程院"
 WSG_port_engineering_institute_desc: "港区的建设需要规划，建造工程院作为经济建设的总管。"
 WSG_port_industry: "港区工业"
 WSG_port_industry_desc: "利用科技赋能工业生产，利用规划调整工业布局，港区的工业水平稳步向前。"
 WSG_industrial_integration: "工业统合"
 WSG_industrial_integration_desc: "在所有的项目落实以后，我们应进一步整合各地区，各项目的发展，统合国内工业，建成工业强国。"

 WSG_admiral_and_port_area: "提督与港区"
 WSG_admiral_and_port_area_desc: "作为港区的领导人和港区体系的核心，提督已然和港区融为一体，你中有我我中有你。"
 WSG_revival_speech: "昭告复兴"
 WSG_revival_speech_desc: "我们的理想是实现幻萌的伟大复兴。"
 WSG_consolidate_the_power_of_the_admiral: "巩固提督权利"
 WSG_consolidate_the_power_of_the_admiral_desc: "作为提督，我的权力是无限的。"
 WSG_encouragement_from_the_admiral: "提督的勉励"
 WSG_encouragement_from_the_admiral_desc: "我是提督，为舰娘所爱，我的勉励就是舰娘的动力。"
 WSG_commanders_order: "提督号令"
 WSG_commanders_order_desc: "我是提督，我的号令就是港区的号令，我的意志就是港区的意志。"
 WSG_admiral_first: "提督至上"
 WSG_admiral_first_desc: "提督大人举世无双，提督大人聪明绝顶，提督大人龙章凤姿。"
 WSG_consolidate_the_power_of_the_secretary_ship: "巩固秘书舰权利"
 WSG_consolidate_the_power_of_the_secretary_ship_desc: "虽然提督是领导人，但港区的很多权力事实上掌握在我秘书舰的手里。"
 WSG_secretary_ship_privilege: "秘书舰特权"
 WSG_secretary_ship_privilege_desc: "我作为秘书舰，拥有一些特权，不过分吧~"
 WSG_the_job_of_a_secretary_ship: "秘书舰的工作"
 WSG_the_job_of_a_secretary_ship_desc: "我作为秘书舰，截取更多工作，掌握更多权力，不过分吧~"
 WSG_secretary_ship_auxiliary_politics: "秘书舰辅政"
 WSG_secretary_ship_auxiliary_politics_desc: "我作为秘书舰，陪在提督左右辅佐政事，那就更不过分了吧~"

 WSG_admiral_and_secretary_ship: "提督与秘书舰"
 WSG_admiral_and_secretary_ship_desc: "要让提督一个人处理诸多事务是不现实的（况且也没能力），那么，任命秘书舰负责各项工作就尤为重要。"
 WSG_admiral_and_secretary_ship_text01:"若完成了国策§Y$WSG_admiral_first$§!，则："
 WSG_admiral_and_secretary_ship_text02:"若完成了国策§Y$WSG_secretary_ship_auxiliary_politics$§!，则："
 WSG_revival_of_holy_right: "复兴圣权"
 WSG_revival_of_holy_right_desc: "请带上这鼎由舰娘为您准备的冠冕吧，还有谁能比您更配得上这份殊荣呢？"

 WSG_secretary_lexington: "代理提督：列克星敦"
 WSG_secretary_lexington_desc: "我会一直在您身边，直到永远。"
 WSG_lexington_plan: "列克星敦方案"
 WSG_lexington_plan_desc: "这是我起草的城市建设方案，还请过目。"
 WSG_expand_resource_output: "扩大资源产出"
 WSG_expand_resource_output_desc: " 我们现在还有资源有待开发，还请挖掘资源潜力，保障我国资源供应。"
 WSG_ship_girl_reserve_army: "舰娘预备军"
 WSG_ship_girl_reserve_army_desc: "我们的潜在兵员是个问题，要不要征召预备队来保障兵员供给。"

 WSG_secretary_vittorio_veneto: "代理提督：维托里奥·维内托"
 WSG_secretary_vittorio_veneto_desc: "还算你有眼，选择了我——放心，我不会让你失望的。"
 WSG_vittorio_veneto_plan: "维托里奥·维内托方案"
 WSG_vittorio_veneto_plan_desc: "（啪）城市规划我已经设计好了，就照我这个来。"
 WSG_restricting_resource_exports: "限制资源出口"
 WSG_restricting_resource_exports_desc: "你傻啊，国内资源都不够用，你还要往出卖？"
 WSG_port_defense_army: "港区保卫军"
 WSG_port_defense_army_desc: "这是今天——（窗外传来行军声）啊，别担心，这是用于保卫港区安全的保卫军。"

 WSG_secretary_yubari: "舰政部长：夕张"
 WSG_secretary_yubari_desc: "感谢您的信任，夕张一定不会辜负您的期望。"
 WSG_government_efficiency: "政府效率"
 WSG_government_efficiency_desc: "我们现在的政府行政效率过于低下，我提议整顿吏治，加强政府效率。"
 WSG_efficient_cabinet: "高效内阁"
 WSG_efficient_cabinet_desc: "效率最怕几个人扯皮，我提议加强内阁的权力，我将组建高效的内阁团队。"
 WSG_wartime_laws_and_regulations: "战时法令"
 WSG_wartime_laws_and_regulations_desc: "战争这样的紧急状况容不得拖沓。我提议颁布战时法令，集中权力。"

 WSG_secretary_hood: "舰政部长：胡德"
 WSG_secretary_hood_desc: "终于想起我了吗？毕竟，我才是看板娘。"
 WSG_efficient_construction: "高效建设"
 WSG_efficient_construction_desc: "我们现在的建设效率太低啦，还是让我来想办法吧。"
 WSG_technological_advantages: "科技优势"
 WSG_technological_advantages_desc: "我们现在的科技太差啦，还是让我来建立科技优势吧。"
 WSG_efficient_internal_affairs: "高效内务"
 WSG_efficient_internal_affairs_desc: "我们现在的内务太乱啦，还是让我来建立高效内务吧。"

 WSG_secretary_yixian: "舰政部长：逸仙"
 WSG_secretary_yixian_desc: "我相信，那个人，就是您。"
 WSG_internal_stability: "内部稳定"
 WSG_internal_stability_desc: "稳定是发展的前提，维持国家内部的稳定方能保障我们的发展。"
 WSG_homeland_defense: "国土防卫"
 WSG_homeland_defense_desc: "战争阴云远没有消散，我们需要重视对国土的防卫，以备万一。"
 WSG_cost_reduction_and_efficiency_improvement: "降本增效"
 WSG_cost_reduction_and_efficiency_improvement_desc: "我们的生产还有很多细节有待优化，到时候，我们生产的成本更低，效率更高。"

 WSG_secretary_jean_bart: "总参谋长：让·巴尔"
 WSG_secretary_jean_bart_desc: "想必您也是认为防御更重要，才会任命我为总参谋长。"
 WSG_rapid_restructuring: "快速重组"
 WSG_rapid_restructuring_desc: "从我的经验来看，一支军队的规模越大，就越会遇到组织问题。为此我们应重视部队的快速重组。"
 WSG_strengthen_the_position: "加固阵地"
 WSG_strengthen_the_position_desc: "堑壕和防御工事可以极大提升我们的防御能力，我们应重视对阵地的加固。"
 WSG_save_strength: "保存实力"
 WSG_save_strength_desc: "胜利属于还有活人的一方。我们应减少损失，尽可能保存实力。"

 WSG_secretary_bubnov: "总参谋长：布勃诺夫"
 WSG_secretary_bubnov_desc: "相信您和我的看法是一样的，那就是——进攻，进攻，再进攻。"
 WSG_indomitable_will: "不屈意志"
 WSG_indomitable_will_desc: "军队的士气，忠诚和不屈不挠的意志将极大地影响战斗力（爱国热情+10%攻防）"
 WSG_fierce_offensive: "凌厉攻势"
 WSG_fierce_offensive_desc: "我们的进攻应该是不可阻挡的，用一波波凌厉的攻势冲垮敌军。"
 WSG_accumulation_of_experience: "经验积累"
 WSG_accumulation_of_experience_desc: "战史，战斗经验，老兵往往能更准确地判断局势。"

 WSG_secretary_clausewitz: "总参谋长：克劳塞维茨"
 WSG_secretary_clausewitz_desc: "速度，速度，请您和我一起建设一支高效的部队吧。"
 WSG_army_mobility: "陆军机动"
 WSG_army_mobility_desc: "战机转瞬即逝，而一支高速机动的部队能够迅速到达目的地，抢占阵地。"
 WSG_preemptive_strike: "先发制人"
 WSG_preemptive_strike_desc: "趁敌人不备率先出击，能让我军先发制人，取得战场主动权。"
 WSG_rapid_construction: "快速工事"
 WSG_rapid_construction_desc: "突破敌军阵地后，工程部队应迅速跟进并确保道路通畅，协助切割敌军。同时前锋继续前进。"

 WSG_pre_mobilization: "预动员"
 WSG_pre_mobilization_desc: "战争阴霾愈发阴沉，有必要进行预动员防备可能的威胁。"
 WSG_naval_construction: "海军大建"
 WSG_naval_construction_desc: "目前，海军的产能无法适应需求。将资金向海军大建方向倾斜，让海军下饺子。"
 WSG_strengthening_heavy_industry: "强化重工业"
 WSG_strengthening_heavy_industry_desc: "钢铁等重工业提供了军工材料，有必要进一步强化重工业，确保军工产能。"
 WSG_port_production_technology: "港区生产技术"
 WSG_port_production_technology_desc: "“装备的标准化可以方便维修和量产。”我们应建立统一的生产标准，改进生产技术，确保军工链条的可靠性。"
 WSG_war_engine: "战争引擎"
 WSG_war_engine_desc: "炮弹一颗颗装载，战车一辆辆运出工厂，无数枪支弹药配装入队。幻萌的战争引擎已经开动。"
 WSG_general_administration_of_war: "战争总署"
 WSG_general_administration_of_war_desc: "现代战争不再是个人间的对抗，而早已成为两国技术，人员，经济，信息等全方面的总体战。有必要建立战争总署作为军队大脑的核心。"

 WSG_between_floating_worlds: "浮世之间"
 WSG_between_floating_worlds_desc: "浮萍之间，是无数幻萌百姓生活的土地，是无数保卫幻萌的士兵。"
 WSG_rebuilding_the_command_system: "重建指挥系统"
 WSG_rebuilding_the_command_system_desc: "随着战争规模的不断扩大，旧有的指挥体系已无力应对。为此，我们应重建指挥系统以适应不断复杂的战争。"
 WSG_rebuilding_the_army_system: "重构陆军体系"
 WSG_rebuilding_the_army_system_desc: "军事技术的进步改变了陆军的组织架构，旧有的单一组织体系已无法适应当下的形势。为此，我们应对陆军体系作出更细致的重构。"
 WSG_marine_ship_installation: "陆战舰装"
 WSG_marine_ship_installation_desc: "当其他人都在呼叫炮兵支援时，我们舰娘已经在用大口径舰炮进行火力覆盖了。"
 WSG_special_warship_equipment: "特战舰装"
 WSG_special_warship_equipment_desc: "兵贵精不贵多，培养一批高素质的特种部队，研制高质量的特战舰装，快速响应战局的变化。"
 WSG_general_naval_equipment: "通用舰装"
 WSG_general_naval_equipment_desc: "乱拳打死老师傅，广阔的战线上需要的是庞大的士兵。在军中普及通用舰装才是应对大规模战争的方法。"
 WSG_cross_river_combat: "跨河作战"
 WSG_cross_river_combat_desc: "陆地作战中，河流就是天然的屏障阻挡着我军前进。为此有必要训练跨河作战。"
 WSG_cross_sea_operations: "跨海作战"
 WSG_cross_sea_operations_desc: "茫茫大海如同一道无法逾越的鸿沟。训练跨海作战，打击敌方核心，开辟新战线以分散敌军军力。"
 WSG_long_range_supply: "长程补给"
 WSG_long_range_supply_desc: "随着我军深入敌境，补给线将不可避免地拉长。为了让前线士兵吃得上饭，我们有必要加强长程补给的能力。"
 WSG_efficient_supply: "高效补给"
 WSG_efficient_supply_desc: "前线士兵不该止步于“吃得上”，而是该“吃得好”。为此我们应优化补给效率，做到高效补给。"
 WSG_army_theoretical_innovation_I: "陆军理论革新I"
 WSG_army_theoretical_innovation_I_desc: "在我们停滞的这段时间，出现了很多军事理论的创新。学呗。"
 WSG_army_theoretical_innovation_II: "陆军理论革新II"
 WSG_army_theoretical_innovation_II_desc: "不能生搬硬套他国理论，而是要对学到的理论进行本土化。"
 WSG_army_theoretical_innovation_III: "陆军理论革新III"
 WSG_army_theoretical_innovation_III_desc: "幻萌军队的独特之处在于舰娘的参与，或许我们可以就舰装的陆地化进行讨论。"
 WSG_shipborne_combat_tactics: "舰装战法"
 WSG_shipborne_combat_tactics_desc: "我们已经完善了舰装陆地化的方案，现在通过演习，我们将确认舰装在战斗中的战术。"
 WSG_army_of_ship_girl_r: "舰R陆军"
 WSG_army_of_ship_girl_r_desc: "迈步向前，放声歌唱，幻萌陆军雄师浩荡。\n数遍勇士，数遍忠良，浴血奋战夺取荣光。\n我们是陆军，为这名号自豪！\n我们是陆军，高声宣告：\n为正义我们率先出征，\n铸就祖国强盛力量，\n陆军滚滚向前方。\n为过往功绩满怀骄傲，\n奋战不息直至凯歌高唱，\n陆军滚滚向前方。\n嗨！嗨！嘿！\n陆军奔赴战场。\n步伐号子洪亮铿锵，\n无论我们去往何方，\n你终将听见，\n陆军滚滚来！"

 WSG_below_the_overarching_sky: "苍穹之下"
 WSG_below_the_overarching_sky_desc: "苍穹之下，是广阔的蓝天，终将由我们驰骋。"
 WSG_air_combat_auxiliary_ship_installation: "空战辅助舰装"
 WSG_air_combat_auxiliary_ship_installation_desc: "经过一定的改装，舰装在某种程度上可以被用于辅助空军作战。"
 WSG_ship_mounted_technical_equipment: "舰装技术机用"
 WSG_ship_mounted_technical_equipment_desc: "经过前期的改装，我们发现舰装或许能直接适配到机体上。那么，我要用副炮打飞机。"
 WSG_air_combat_ship_girl: "空战舰娘"
 WSG_air_combat_ship_girl_desc: "既然舰装能上机，那么舰娘能不能上天呢？答案是肯定的。"
 WSG_near_earth_support: "近地支援"
 WSG_near_earth_support_desc: "我们的空军应专注于近地支援，从天空压制敌人火力，配合陆军突破阵地。"
 WSG_specialized_aerial_combat: "空战特化"
 WSG_specialized_aerial_combat_desc: "天空理应属于幻萌，天空才是空军的主战场。通过特化空军的空对空能力，我们能确保掌握制空权。"
 WSG_long_range_bombing: "长程轰炸"
 WSG_long_range_bombing_desc: "战争打的就是后勤。与其费尽心思地打击前线，不如绕过战场打击敌人的后勤补给和工业设施。"
 WSG_air_force_theoretical_innovation_I: "空军理论革新I"
 WSG_air_force_theoretical_innovation_I_desc: "尽管在技术上可以实现，但舰装机用到底效果如何还有待商榷。"
 WSG_air_force_theoretical_innovation_II: "空军理论革新II"
 WSG_air_force_theoretical_innovation_II_desc: "通过演习，我们发现舰装好像真有点说法。"
 WSG_air_force_theoretical_innovation_III: "空军理论革新III"
 WSG_air_force_theoretical_innovation_III_desc: "我们现在确信将舰装应用于空军是可行的，然而目前我们还需要确定战术。"
 WSG_ship_aircraft_integration: "舰机一体化"
 WSG_ship_aircraft_integration_desc: "通过理论学习和军事演习，舰娘现在已经完全可以胜任空军作战。"
 WSG_air_force_of_ship_girl_r: "舰R空军"
 WSG_air_force_of_ship_girl_r_desc: "我们生来为把神话变为现实，\n要征服无边无际辽阔空间。\n智慧赋予我们钢铁的翅膀，\n燃烧的马达就是我们心脏。\n飞得更高，更高，再更高，\n我们战鹰向着云天翱翔。\n每一副螺旋桨都在捍卫\n祖国边境安宁不受侵扰。\n驾驭战机向着高空去飞翔，\n创造出前所未有的远航。\n我们看见祖国日益强盛，\n我们随时准备飞向战场。\n不怕风暴，不怕乌云蔽天，\n也不怕高空俯冲的险关。\n无数雄鹰和我们在一起，\n勇敢飞行员并肩去作战。"

 WSG_above_the_byss: "深渊之上"
 WSG_above_the_byss_desc: "深渊之上，是蔚蓝的海洋，是幻萌的生命线，是舰娘的主场，是海军那往昔的荣光。"
 WSG_naval_warfare_ship_equipment: "海战舰装"
 WSG_naval_warfare_ship_equipment_desc: "别人是笨重的舰炮，幻萌是轻便的舰装。"
 WSG_warships_and_ship_equipment: "战舰与舰装"
 WSG_warships_and_ship_equipment_desc: "战舰是死的，但舰娘是活的。舰娘在海战中拥有主观能动性，能够灵活运用舰装打击敌舰。"
 WSG_sea_air_collaboration: "海空协同"
 WSG_sea_air_collaboration_desc: "侦查，校射，释放烟雾。空中力量在海战中发挥着无可替代的作用。"
 WSG_overwhelming_fire_power: "优势火力"
 WSG_overwhelming_fire_power_desc: "看！她挺着矫健的身姿，准备给敌人致命的打击。"
 WSG_air_superiority: "空中优势"
 WSG_air_superiority_desc: "她站在甲板上，微笑着看向远方。而在她的身后数不清的飞机向前方飞去。"
 WSG_naval_theoretical_innovation_I: "海军理论革新I"
 WSG_naval_theoretical_innovation_I_desc: "旧有的战列线已然无法适应新时代的海战，我们要寻找新的战法。"
 WSG_naval_theoretical_innovation_II: "海军理论革新II"
 WSG_naval_theoretical_innovation_II_desc: "战列舰不止排开战列线这一种方法，高速的战列巡洋舰能够凭借速度优势执行侦查，破交等任务。"
 WSG_naval_theoretical_innovation_III: "海军理论革新III"
 WSG_naval_theoretical_innovation_III_desc: "光有战列舰是不够的，防空炮，鱼雷，飞机都必不可少。"
 WSG_honor_navy: "荣耀海军"
 WSG_honor_navy_desc: "我们幻萌海军就是荣耀的代言人！"
 WSG_navy_of_ship_girl_r: "舰R海军"
 WSG_navy_of_ship_girl_r_desc: "背起你的皮质行囊，\n战友，我们驶向海洋！\n柴油引擎轰鸣启动，\n战友，出击号令已然吹响！\n我们即将前去狩猎，\n在苍茫大海之上，\n痛击幻萌的敌人。\n我们是幻萌的女儿，\n灰海之上的狼群。\n死亡在前方悄然飘荡，\n敌舰即是我们的猎获。\n今日在此，明日彼方，\n海军上将给予我们训令。\n战友们永远要牢记：\n进攻！逼近！把敌舰击沉！\n日复一日，长夜漫漫，\n我们悄悄追踪猎物，\n不惧敌舰疯狂的反扑。\n我们驰骋于汪洋大海，\n但心中誓言向着故土。"

 WSG_port_area_and_tomorrow: "港区与明天"
 WSG_port_area_and_tomorrow_desc: "深海入侵即将来临，而国内风起云涌。幻萌的明天又会是怎样的？"
 WSG_from_the_deep_sea: "来自深海"
 WSG_from_the_deep_sea_desc: "她们来了！带着人们最原始的恐惧，誓要戳破一切幻想。"
 WSG_from_the_deep_sea_text: "§Y该国策会开启一系列影响港区路线的任务及决议，完成后将会解锁对应的后续国策。§!"

