 WSG_game_text.01.t: "滩头残墨"
 WSG_game_text.01.d: "（在一次深海的进攻被击退后）\n“本连所有...还活着的...集合...”我推开倒在身上的尸体，从瓦砾堆中爬起，拖着带血的右腿，勉强找到一处还算空旷的地方，召集部下集合。\n土块跌落，武器拖动，寒风呼啸，零星几位士兵的哀叹......十几个人稀稀拉拉地站到我面前。\n“呃......”我想说什么，但突然感到一阵胸闷，什么都说不出来。看着仅剩的部下——舰炮损坏、衣服破旧、满面尘土、连站立的气力都快没有了——“全连，清理战场遗骸，准备——”我叹了口气，“组织下一波防御。”\n没有交谈，没有抱怨，只有风声和尸体的拖动声。\n我转过身，凝视着海面——海浪同往常一样拍打着岸边，月亮同往常一样高悬在空中，仿佛什么都没有发生。\n“嚓——沙沙……咕、咚”我转过身，正好和一名士兵对视——她嘴巴微张，面色惊恐——我看向她拖拽的尸体，缓缓地蹲下——扯下一个铭牌，擦掉上面的污泥：\n“DZERZHINSKY\nSVERDLOV CLASS LIGHT CRUISER\nCL-017\nA POS | CORE: MEDIUM ARMORED\nGROUND FORCES, WESTERN MILITARY DISTRICT”\n我盯着铭牌，又看向她，突然发现：在她胸前的舰装收纳袋里，有一本用油布仔细裹好的日记本。油布沾了泥土与暗色血渍，还没有完全浸透。\n我拿出那本日记本，它的外皮精美，略微鼓起。"
 WSG_game_text.01.a: "翻开第一页，字迹工整优美："
 WSG_game_text.02.t: "滩头残墨"
 WSG_game_text.02.d: "999.5.20\n今天提督给了我一份大礼耶，誓约之戒！嘿嘿，回想当时的画面，他跪在我面前，为我戴上戒指。那场面，简直就是求婚啊啊啊啊~我现在越来越期待后面的生活了。\n......\n999.12.25\n今天提督邀请我去大名鼎鼎的四叶草剧场，还是特等票哦~艾丽卡亲自接待~凯赛琳、白、艾希、和这些名人近距离接触~而且，演出结束后，提督还和我，嘿，提督的，好舒服~\n......\n1000.1.7\n提督这人是怎么搞的，怎么约会到一半人就跑了！不过毕竟是秘书舰打来的，看他那慌张样，也许真有什么急事吧。\n1000.1.8\n近期深海活动频繁！？那我还能和提督约会吗？不对啊，我是舰娘啊，舰娘就应该......啊啊啊啊啊好烦啊！\n......\n1000.1.10\n睡不着，不睡啦。翻翻以前的照片吧。这一张是和提督的初次见面...这一张是和姐妹们逛街...啊，这是那个跟我搭话的小孩......要是深海打过来，这些照片，都还会有吗？\n1000.1.11\n要是深海真的打进来......提督还会有吗？姐妹们还会在吗？那个小孩还会活着吗？要是不能，又该怎么办呢？\n1000.1.12\n今天军队突然开始征兵了......我要去吗？\n1000.1.13\n我还是站在了征兵办的门口。负责人问我“你做好觉悟为幻萌献上一切，乃至生命了吗？”我说我做好了......真的做好了吗？\n......\n1000.7.14\n训练，日复一日不停的训练。每天练得我都要散架了。但，这是必要的，不然我要怎么守护我爱的一切？\n......"
 WSG_game_text.02.a: "（翻页声）"
 WSG_game_text.03.t: "滩头残墨"
 WSG_game_text.03.d: "1001.1.6\n今天是动员大会，我们将要奔赴前线了！想想还有点小激动，电影里的那些英雄画面会发生在我身上吗？\n1001.1.7\n正式向前线开拔了，感觉自己在做梦，感觉自己心跳好快，脑子里想着提督的身影。连长在前面宣读作战指令，我们要加固工事，组织防御。\n1001.1.8\n正式到达前线了，怎么和我想的完全不一样啊！残缺的工事，泥泞的土地，灰蒙蒙的天空，有腥味的海风......电影原来是在骗我吗？\n1001.1.10\n今天深海打过来啦，她们火力那么猛吗？我感觉我耳朵都要聋了，也记不得训练过的战术了。......基辅，明明，昨天，还和我，开玩笑，今天，就，死，死了！？（字迹颤抖，断断续续）\n1001.1.11\n深海又来吗？今天，工事基本被炸毁了，身边有三位姐妹也......死了......\n1001.1.12\n深海又来了，今天我们排又死了四个人。\n1001.1.13\n深海又来，死了三个。\n1001.1.14\n又来，四个。\n1001.1.15\n情报显示，明天深海将发动史无前例的攻势，提督，我还能见到你吗？\n1001.1.16\n我们能再相见吗？我们（日记写到这里没有了后续）"
 WSG_game_text.03.a: "(合上日记本)"
 WSG_game_text.04.t: "滩头残墨"
 WSG_game_text.04.d: "“嗬——呼……”我深呼吸，缓缓站起身。\n“长官，怎么办。”拖拽尸体的士兵战战兢兢地问我。\n“阵亡士兵，捷尔任斯基。遗物，日记本，和铭牌放到一起，归类，存入档案。”我抬头看向远方，回避着士兵的视线，下达命令。"
 WSG_game_text.04.a: "耳边再次传来海浪的拍击声，海风吹过，腥味又重了一点......"
 WSG_game_text.05.t: "快门"
 WSG_game_text.05.d: "“哈哈啊~空想，不要这样啦~”\n“就要就要我就要~”我无视恶毒的哀求，继续挠着痒。\n“空想——恶毒——排到我们啦。”凯旋挥舞着胳膊，招呼我们过去。\n“啊！？好。”我赶忙松开手，赶往排队队伍里。\n“凯旋，要坐过山车啦，你怕不怕？”可怖略带挑逗地开凯旋的玩笑。\n“我......才不怕呢。”凯旋故作镇定地回复。\n“嘿嘿”我略带微笑，回头看着妹妹们。\n“难得坐一次过山车，我们来拍张照吧。”不屈从后面探出头来，手里拿着相机，眼睛闪闪发光。\n“好啊~好~行~来吧~”\n“我......”妹妹们看向我，“我就算了。”\n“唉~为什么~”不屈略带失望地看着我。\n“我......不太喜欢......”我回避着不屈的眼睛。\n“那好吧......那我们五个人拍吧。”"
 WSG_game_text.05.a: "（咔嚓）"
 WSG_game_text.06.t: "快门"
 WSG_game_text.06.d: "“啊啊啊啊啊~”凯旋趴在我的背上，还没从过山车缓过来。\n“就说你会怕，你还不信~”可怖略带得意地笑话着凯旋。\n“唔~”凯旋埋低头，无力地回复。\n“之后我们去哪？要不去喝杯奶茶吧？”大胆指着不远处的奶茶店。\n“那走吧？”\n\n（吸溜——，嘶噜）\n“今天可是玩开心了。”恶毒猛吸了一口奶茶。\n“是啊。”我看着妹妹。\n“呜呜呜呜——————”警报响起。\n“怎么了！？”妹妹们吓了一跳。\n此时，我的通讯器响了......\n“抱歉啦，我突然有急事，先走了。”我慌乱地离开座位，和妹妹们告别。\n“对了。”走了几步，我缓缓转过身来，"
 WSG_game_text.06.a: "“来拍张照吧。”"



